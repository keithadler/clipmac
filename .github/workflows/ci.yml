name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit suites via XCTest
        run: swift test
      - name: Build universal app
        run: ./build-app.sh
      - name: Unit suites via the binary (what users can run without Xcode)
        run: "'build/Clip for Mac.app/Contents/MacOS/ClipMac' selftest"
      - name: Integration (real app, isolated data directory)
        run: ./tests/integration.sh
