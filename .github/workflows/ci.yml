name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests (XCTest, needs Xcode on the runner)
        run: swift test
      - name: Build universal app
        run: ./build-app.sh
      - name: Built-in self-test
        run: "'build/Clip for Mac.app/Contents/MacOS/ClipMac' selftest"
      - name: CLI smoke
        run: |
          B='build/Clip for Mac.app/Contents/MacOS/ClipMac'
          "$B" version
          "$B" status --json
          "$B" list --json
